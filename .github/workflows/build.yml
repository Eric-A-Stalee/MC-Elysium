name: Build and GameTests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify generated content
        run: |
          python3 tools/generate_assets.py --check
          python3 tools/generate_worldgen.py --check
          python3 tools/validate_worldgen.py
      - name: Compile and package
        run: ./gradlew build --no-daemon
      - name: Run dedicated-server GameTests
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          ./gradlew runGameTestServer --no-daemon
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: elysium-neoforge-1.21.1
          path: build/libs/*.jar
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs
          path: |
            run/logs/
            build/reports/
          if-no-files-found: ignore
