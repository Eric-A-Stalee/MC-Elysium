name: Build and GameTests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  compat-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test the optional erosion guard
        run: ./gradlew -p compat :guard:test :guard:build --no-daemon
      - name: Check license packaging and external dependency rejection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import zipfile

          jars = list(Path('compat/guard/build/libs').glob('*.jar'))
          assert jars, 'No erosion guard jar was built'
          for jar in jars:
              with zipfile.ZipFile(jar) as archive:
                  assert archive.read('META-INF/LICENSE') == Path('compat/LICENSE').read_bytes()

          # Neither check needs, downloads, or substitutes for the private mod jars.
          for arguments, expected in (
              ([], 'Missing rtfJar;'),
              (['-PrtfJar=LICENSE'], 'Unsupported rtfJar SHA-256:'),
          ):
              result = subprocess.run(
                  ['./gradlew', '-p', 'compat', ':elysiumcompat:verifyExternalJars',
                   '--no-daemon', '--console=plain', *arguments],
                  text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              if result.returncode == 0 or expected not in result.stdout:
                  raise AssertionError(result.stdout)
              print(expected, 'rejected as expected')
          PY
      - name: Upload compatibility test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-guard-test-reports
          path: |
            compat/guard/build/reports/tests/
            compat/guard/build/test-results/
          if-no-files-found: ignore

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify generated content
        run: |
          python3 tools/generate_assets.py --check
          python3 tools/generate_ambience.py --check
          python3 tools/validate_client_assets.py
          python3 tools/generate_worldgen.py --check
          python3 tools/validate_worldgen.py
      - name: Compile and package
        run: ./gradlew build --no-daemon
      - name: Run dedicated-server GameTests
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          ./gradlew runGameTestServer --no-daemon
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: elysium-neoforge-1.21.1
          path: build/libs/*.jar
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs
          path: |
            run/logs/
            build/reports/
          if-no-files-found: ignore
